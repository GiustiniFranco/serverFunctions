<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PC Touch PWA - OpenCV ArUco</title>
    <link rel="manifest" href="manifest.json">
    <!-- Load official OpenCV ArUco JavaScript Port Libraries via CDN -->
    <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/src/cv.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/src/aruco.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; width: 100%; height: 100%; touch-action: none; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 10px; color: white; font-family: sans-serif; text-align: center; width: 260px; }
        select, input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 13px; }
        button { width: 100%; padding: 8px 16px; background: #007acc; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
        #status { font-size: 11px; margin-top: 6px; color: #ff4444; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    
    <div id="ui">
        <select id="cameraSelect">
            <option value="">Loading cameras...</option>
        </select>
        <input type="text" id="serverIp" placeholder="PC IP (e.g. 192.168.1.50)">
        <button id="connectBtn">Connect</button>
        <div id="status">Disconnected / Searching ArUco Markers</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const cameraSelect = document.getElementById('cameraSelect');

        let ws = null;
        let detector = new AR.Detector();
        let screenCorners = null;
        let currentStream = null;

        async function populateCameraDropdown() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Failed to enumerate cameras:', err);
            }
        }

        async function startCamera(deviceId = null) {
            // Clean up existing camera stream
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            // Anti-blur high framerate & resolution constraints
            const videoConstraints = {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 60, min: 30 }
            };

            if (deviceId) {
                videoConstraints.deviceId = { exact: deviceId };
            } else {
                videoConstraints.facingMode = { ideal: 'environment' };
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
                video.srcObject = currentStream;
                
                video.onloadedmetadata = () => {
                    video.play();
                };

                await populateCameraDropdown();
                if (deviceId) {
                    cameraSelect.value = deviceId;
                }
            } catch (err) {
                alert('Camera error: ' + err.message);
            }
        }

        cameraSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                startCamera(e.target.value);
            }
        });

        document.getElementById('connectBtn').addEventListener('click', () => {
            const ip = document.getElementById('serverIp').value.trim();
            if (!ip) { alert('Enter valid IP'); return; }
            ws = new WebSocket(`ws://${ip}:8080/ws/`);
            ws.onopen = () => { statusDiv.style.color = '#44ff44'; statusDiv.innerText = 'Connected to PC'; };
            ws.onclose = () => { statusDiv.style.color = '#ff4444'; statusDiv.innerText = 'Disconnected'; };
            ws.onerror = () => { statusDiv.style.color = '#ff4444'; statusDiv.innerText = 'Connection Error'; };
        });

        function processLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const markers = detector.detect(imageData);

                if (markers && markers.length === 4) {
                    let found = {};
                    markers.forEach(m => {
                        let cx = (m.corners[0].x + m.corners[1].x + m.corners[2].x + m.corners[3].x) / 4;
                        let cy = (m.corners[0].y + m.corners[1].y + m.corners[2].y + m.corners[3].y) / 4;
                        found[m.id] = { x: cx, y: cy };
                    });

                    if (found[0] && found[1] && found[2] && found[3]) {
                        screenCorners = found;
                        statusDiv.innerText = 'ArUco Markers Locked (OpenCV Engine)';
                        statusDiv.style.color = '#44ff44';

                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(found[0].x, found[0].y);
                        ctx.lineTo(found[1].x, found[1].y);
                        ctx.lineTo(found[3].x, found[3].y);
                        ctx.lineTo(found[2].x, found[2].y);
                        ctx.closePath();
                        ctx.stroke();
                    } else {
                        statusDiv.innerText = 'Markers found, but missing IDs (0-3)';
                        statusDiv.style.color = '#ffaa00';
                    }
                } else {
                    statusDiv.innerText = `Searching for ArUco Markers (${markers ? markers.length : 0}/4)...`;
                    statusDiv.style.color = '#ffaa00';
                }
            }
            requestAnimationFrame(processLoop);
        }

        function mapTouchToNormalized(px, py, m) {
            const minX = Math.min(m[0].x, m[2].x);
            const maxX = Math.max(m[1].x, m[3].x);
            const minY = Math.min(m[0].y, m[1].y);
            const maxY = Math.max(m[2].y, m[3].y);

            const u = Math.max(0, Math.min(1, (px - minX) / (maxX - minX)));
            const v = Math.max(0, Math.min(1, (py - minY) / (maxY - minY)));

            return { u, v };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN || !screenCorners) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touchX = (e.clientX - rect.left) * scaleX;
            const touchY = (e.clientY - rect.top) * scaleY;

            const { u, v } = mapTouchToNormalized(touchX, touchY, screenCorners);
            ws.send(`${u.toFixed(4)},${v.toFixed(4)}`);
        });

        startCamera().then(() => {
            requestAnimationFrame(processLoop);
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
